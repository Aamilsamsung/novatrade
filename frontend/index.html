<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>NovaTrade</title>
<style>body{margin:0;background:#07120e;color:#eafff5;font:16px system-ui}main{max-width:1100px;margin:auto;padding:30px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#0d2018;border:1px solid #214536;border-radius:15px;padding:18px;margin-top:15px}.num{font-size:28px;font-weight:800}input,button{padding:11px;border-radius:9px;margin:5px;border:1px solid #456b5a;background:#08150f;color:white}button{cursor:pointer}.go{background:#63e8a7;color:#062016;border:0}.stop{background:#ff7777;color:#210606;border:0}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}}</style></head>
<body><main><h1>NovaTrade</h1><p>Paper-trading dashboard — virtual money only.</p>
<div class="cards"><div class="card">Portfolio<div id="eq" class="num">₹1000</div></div><div class="card">P&L<div id="pl" class="num">₹0</div></div><div class="card">Price<div id="pr" class="num">₹100</div></div><div class="card">Bot<div id="run" class="num">OFF</div></div></div>
<div class="card"><h2>Setup</h2><input id="amt" type="number" value="1000" min="1"><button onclick="reset()">Reset</button><button class="go" onclick="post('/api/start')">Start</button><button class="stop" onclick="post('/api/stop')">Stop</button><button class="stop" onclick="post('/api/close')">Close position</button></div>
<div class="card"><h2>Trades</h2><pre id="log">No trades</pre></div></main>
<script>const A='';async function post(p,b){let r=await fetch(A+p,{method:'POST',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):null});render(await r.json())}async function get(){render(await(await fetch(A+'/api/state')).json())}function render(x){eq.textContent='₹'+x.equity.toFixed(2);pl.textContent=(x.pnl>=0?'+':'')+'₹'+x.pnl.toFixed(2);pr.textContent='₹'+x.price.toFixed(2);run.textContent=x.running?'ON':'OFF';log.textContent=x.trades.slice().reverse().map(t=>`${t.side} ${t.qty} @ ₹${t.price} | P&L ₹${t.pnl} | ${t.reason}`).join('\n')||'No trades'}function reset(){post('/api/reset',{amount:+amt.value,risk_pct:1,stop_pct:2,target_pct:4})}setInterval(()=>post('/api/tick'),3000);get()</script></body></html>
